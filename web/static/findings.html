<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARGUS · Findings</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230e1013'/%3E%3Cpath d='M16 6l10 10-10 10L6 16z' fill='%23f2b45a'/%3E%3C/svg%3E">
<style>
  /* ARGUS deck — simplified dark, amber accent, mascot companion */
  :root { --bg:#0e1013; --panel:#161a20; --panel2:#1b2028; --line:#262c35;
          --ink:#e2e6ec; --dim:#8a94a2; --amber:#f2b45a; --gold:#f2b45a;
          --cyan:#79b3c4; --sage:#8fbf8a; --rose:#e0857a; --green:#8fbf8a; --sel:#243040; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); min-height:100vh;
         font:14px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  ::selection { background:#334255; color:#fff; }
  input[type=checkbox]{ accent-color:var(--amber); }
  header { display:flex; align-items:center; gap:6px; padding:12px 22px; border-bottom:1px solid var(--line);
           position:sticky; top:0; z-index:20; background:rgba(14,16,19,.92); backdrop-filter:blur(8px); }
  .brand { font-weight:800; letter-spacing:.5px; margin-right:6px;
           font-family:ui-monospace,"Cascadia Code",Consolas,monospace; }
  .brand b { color:var(--amber); }
  nav { display:flex; gap:2px; }
  nav a { color:var(--dim); text-decoration:none; padding:6px 12px; border-radius:8px; font-size:13px; }
  nav a:hover { color:var(--ink); background:var(--panel); }
  nav a.on { color:var(--amber); background:var(--panel); }
  header .sub { color:var(--dim); font-size:12px; margin-left:8px; }
  button { font:inherit; cursor:pointer; border:1px solid var(--line); background:var(--panel);
           color:var(--ink); padding:6px 12px; border-radius:8px; transition:.12s; }
  button:hover { border-color:var(--amber); color:var(--amber); }
  button.go { border-color:#5a4a2a; color:var(--amber); }
  button.go:hover { background:#241c10; }
  button.warn { border-color:var(--rose); color:var(--rose); }
  a { color:var(--cyan); text-decoration:none; }
  #wrap { padding:22px; max-width:920px; margin:0 auto; position:relative; z-index:2; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px;
          padding:16px 18px; margin-bottom:14px; }
  .card h2 { font-size:14px; margin:0 0 8px; word-break:break-all; }
  .badge { display:inline-block; padding:2px 9px; border-radius:999px; font-size:10.5px;
           font-weight:700; text-transform:uppercase; letter-spacing:.5px; }
  .b-suspicious { background:rgba(224,133,122,.14); color:var(--rose); }
  .b-benign { background:rgba(143,191,138,.14); color:var(--green); }
  .b-inconclusive { background:rgba(138,148,162,.14); color:var(--dim); }
  .b-approved { background:rgba(242,180,90,.16); color:var(--amber); }
  .b-published { background:rgba(143,191,138,.14); color:var(--sage); }
  .b-pending-review { background:rgba(242,180,90,.16); color:var(--amber); }
  .b-family { background:rgba(121,179,196,.16); color:var(--cyan); }
  .meta { color:var(--dim); font-size:12px; margin:6px 0; font-family:ui-monospace,Consolas,monospace; }
  .meta b { color:var(--ink); font-weight:600; }
  .links { display:flex; gap:16px; flex-wrap:wrap; margin:9px 0; }
  .links a { color:var(--cyan); }
  .tweet { width:100%; background:#0e1116; color:var(--ink); border:1px solid var(--line);
           border-radius:8px; padding:9px; font:13px ui-monospace,Consolas,monospace; resize:vertical; min-height:56px; }
  .safety { background:rgba(224,133,122,.1); border:1px solid #4a2f2b; color:var(--rose);
            padding:8px 10px; border-radius:8px; margin:8px 0; font-size:12px; }
  .actions { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-top:10px; }
  label.t { color:var(--dim); font-size:12px; display:inline-flex; align-items:center; gap:4px; }
  .out { font-size:12px; color:var(--dim); margin-top:8px; white-space:pre-wrap; font-family:ui-monospace,Consolas,monospace; }
  .empty { color:var(--dim); text-align:center; padding:40px; }
  /* mascot companion — fades into the page on the right */
  #mascot { position:fixed; right:0; bottom:0; height:min(80vh,760px); z-index:1; pointer-events:none;
            -webkit-mask-image:linear-gradient(to left,#000 42%,transparent 94%);
            mask-image:linear-gradient(to left,#000 42%,transparent 94%); opacity:.9; }
  @media(max-width:1200px){ #mascot{ opacity:.25; } }
  @media(max-width:860px){ #mascot{ display:none; } }
</style>
</head>
<body>
<img id="mascot" src="/static/mascot.jpg" alt="" onerror="this.style.display='none'">
<header>
  <span class="brand">◆ <b>ARGUS</b></span>
  <nav>
    <a href="/panel" class="on">Findings</a>
    <a href="/re">Reverser</a>
    <a href="/">Console</a>
  </nav>
  <span class="sub" id="sub"></span>
  <span style="flex:1"></span>
  <button id="autoBtn" onclick="toggleAuto()" title="Auto-publish high-confidence findings to VT + site">Autopilot: …</button>
  <button class="go" id="allBtn" onclick="publishAll()">Publish all → VT</button>
  <button onclick="load()">Refresh</button>
</header>
<div id="batchBar" style="display:none;padding:12px 22px;border-bottom:1px solid var(--line);background:#1c140b">
  <div id="batchMsg" style="color:var(--ink)"></div>
  <div style="height:8px;background:#140e07;border-radius:3px;margin-top:8px;overflow:hidden;border:1px solid var(--line)">
    <div id="batchFill" style="height:100%;width:0;background:var(--amber);transition:width .3s"></div>
  </div>
  <div id="batchLog" class="out" style="margin-top:8px;max-height:160px;overflow:auto"></div>
</div>
<div id="wrap"><div class="empty">loading...</div></div>

<script>
const $wrap = document.getElementById('wrap');
const esc = s => (s??'').toString().replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function api(path, body) {
  const opt = body ? {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)} : {};
  const r = await fetch(path, opt);
  return r.json();
}

function card(d) {
  const vb = 'b-' + (d.verdict||'inconclusive');
  const sb = 'b-' + (d.status||'pending-review');
  const targets = ['vt','twitter','linkedin'];
  const canPublish = d.status === 'approved';
  const published = d.status === 'published';
  return `<div class="card" data-id="${esc(d.id)}">
    <h2>${esc(d.sample||d.id)}
      <span class="badge ${vb}">${esc(d.verdict||'?')}</span>
      ${d.family?`<span class="badge b-family">${esc(d.family)}</span>`:''}
      <span class="badge ${sb}">${esc(d.status||'?')}</span></h2>
    <div class="meta">confidence <b>${d.confidence??'?'}%</b> &middot; signals <b>${esc((d.signals||[]).join(', ')||'-')}</b></div>
    <div class="meta">ATT&CK <b>${esc((d.attack||[]).join(', ')||'-')}</b> &middot; VirusTotal <b>${esc(d.vt||'n/a')}</b></div>
    <div class="meta">sha256 <b>${esc((d.sha256||'').slice(0,32))}...</b></div>
    <div class="meta links">
      ${d.report_url?`<a href="${esc(d.report_url)}" target="_blank" rel="noopener">📄 Blog report</a>`:''}
      ${d.vt_url?`<a href="${esc(d.vt_url)}" target="_blank" rel="noopener">🔍 VirusTotal</a>`:''}
      ${d.sha256?`<a href="https://bazaar.abuse.ch/sample/${esc(d.sha256)}" target="_blank" rel="noopener">📦 MalwareBazaar</a>`:''}
    </div>
    ${d.safety ? `<div class="safety">SAFETY: ${esc(d.safety)} - publish blocked unless you tick "force override"</div>` : ''}
    <textarea class="tweet" readonly>${esc(d.tweet||'')}</textarea>
    <div class="actions">
      ${published ? '<span class="badge b-published">PUBLISHED</span>' :
        canPublish ? `
          ${targets.map(t=>`<label class="t"><input type="checkbox" class="tg" value="${t}" ${t==='vt'?'checked':''}> ${t}</label>`).join('')}
          <label class="t"><input type="checkbox" class="force"> force override</label>
          <button onclick="send('${esc(d.id)}', false)">Dry run</button>
          <button class="go" onclick="send('${esc(d.id)}', true)">Publish</button>`
        : `<button class="go" onclick="approve('${esc(d.id)}')">Approve</button>`}
    </div>
    <div class="out"></div>
  </div>`;
}

async function load() {
  const r = await api('/api/publish/drafts');
  const drafts = (r.drafts||[]);
  document.getElementById('sub').textContent = `${drafts.length} finding(s) - nothing posts without your click`;
  $wrap.innerHTML = drafts.length ? drafts.map(card).join('') : '<div class="empty">No findings in the review queue yet. Run a hunt.</div>';
}

async function approve(id) {
  const r = await api('/api/publish/approve', {draft:id});
  out(id, r.error ? 'ERROR: '+r.error : 'approved - now pick targets and Publish');
  load();
}

async function send(id, confirm) {
  const el = document.querySelector(`.card[data-id="${id}"]`);
  const targets = [...el.querySelectorAll('.tg:checked')].map(c=>c.value);
  const force = el.querySelector('.force')?.checked || false;
  if (!targets.length) { out(id, 'pick at least one target'); return; }
  const r = await api('/api/publish/send', {draft:id, targets, confirm, force});
  if (r.error) { out(id, 'ERROR: '+r.error); return; }
  if (r.blocked) { out(id, 'BLOCKED: '+r.blocked); return; }
  const mode = r.dry_run ? 'DRY RUN (nothing sent)' : 'LIVE PUBLISH';
  const lines = (r.results||[]).map(x => x.skipped ? `  - ${x.target}: skipped (${x.detail})`
    : `  ${x.ok?'OK ':'ERR'} ${x.target}: ${x.detail}`);
  out(id, `== ${mode} ==\n` + lines.join('\n'));
  if (!r.dry_run) load();
}

function out(id, msg) {
  const el = document.querySelector(`.card[data-id="${id}"] .out`);
  if (el) el.textContent = msg;
}

// ---- batch: publish all eligible findings to VirusTotal ----
let batchTimer = null;
async function publishAll() {
  // 1. dry run first — how many are eligible (unpublished + safety-cleared)?
  const dry = await api('/api/publish/all', { targets: ['vt'], confirm: false });
  if (dry.error) { alert(dry.error); return; }
  const n = dry.eligible || 0;
  if (!n) { alert('Nothing eligible — every finding is either already published or blocked by the safety gate.'); return; }
  if (!confirm(`Post ${n} finding(s) to VirusTotal as public comments?\n\n`
      + `Already-published and low-confidence/contradicted findings are skipped.\n`
      + `Paced ~16s apart to respect the free API rate limit (≈${Math.ceil(n*16/60)} min).`)) return;
  // 2. confirmed — start the background batch
  const bar = document.getElementById('batchBar');
  bar.style.display = 'block';
  document.getElementById('allBtn').disabled = true;
  document.getElementById('batchMsg').textContent = `Starting batch — ${n} finding(s)…`;
  document.getElementById('batchLog').textContent = '';
  document.getElementById('batchFill').style.width = '0';
  const r = await api('/api/publish/all', { targets: ['vt'], confirm: true });
  if (r.error) { alert(r.error); document.getElementById('allBtn').disabled = false; return; }
  batchTimer = setInterval(pollBatch, 1500);
}
async function pollBatch() {
  const s = await api('/api/publish/all/status');
  const pct = s.total ? Math.round(s.done / s.total * 100) : 0;
  document.getElementById('batchFill').style.width = pct + '%';
  document.getElementById('batchMsg').textContent =
    `${s.done}/${s.total} processed — ${s.posted} posted, ${s.skipped} skipped, ${s.failed} failed`;
  document.getElementById('batchLog').textContent =
    (s.results || []).map(x => `${x.ok ? 'OK ' : '·  '} ${x.sample?.slice(0,40)}  ${x.detail}`).join('\n');
  if (s.finished || !s.running) {
    clearInterval(batchTimer); batchTimer = null;
    document.getElementById('allBtn').disabled = false;
    document.getElementById('batchMsg').textContent =
      `Done — ${s.posted} posted, ${s.skipped} skipped, ${s.failed} failed.`;
    load();
  }
}

// ---- autopilot toggle ----
async function refreshAuto() {
  try {
    const s = await api('/api/autopublish/status');
    const b = document.getElementById('autoBtn');
    const siteOk = s.site && s.site.configured;
    b.textContent = `Autopilot: ${s.running ? 'ON' : 'OFF'} (≥${s.threshold}%)`;
    b.className = s.running ? 'go' : '';
    b.title = `Auto-publish ≥${s.threshold}% safety-cleared findings to ${s.targets.join(' + ')}. `
      + `VT key: ${s.vt_ready ? 'ready' : 'missing'}; site: ${siteOk ? 'configured' : 'not configured'}.`;
  } catch (e) {}
}
async function toggleAuto() {
  const s = await api('/api/autopublish/status');
  if (!s.running) {
    let warn = `Enable Autopilot?\n\nHigh-confidence (≥${s.threshold}%) safety-cleared findings will `
      + `AUTO-publish to ${s.targets.join(' + ')} with no further clicks.`;
    if (!s.vt_ready && s.targets.includes('vt')) warn += `\n\n⚠ VT_API_KEY not set — VT posts will be skipped.`;
    if (s.targets.includes('site') && !(s.site && s.site.configured)) warn += `\n\n⚠ ARGUS_SITE_DIR not set — site posts will fail.`;
    if (!confirm(warn)) return;
  }
  await api('/api/autopublish/toggle', { on: !s.running });
  setTimeout(refreshAuto, 600);
}
refreshAuto();

load();
</script>
</body>
</html>
