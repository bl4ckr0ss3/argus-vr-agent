<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARGUS - Findings & Publish</title>
<style>
  :root { --bg:#0b0e14; --panel:#131722; --line:#242a38; --ink:#dfe6f2; --dim:#8b9bb4;
          --amber:#fbbf24; --cyan:#38bdf8; --rose:#f43f5e; --green:#34d399; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:14px/1.5 ui-monospace,"Cascadia Code",Consolas,monospace; }
  header { padding:16px 22px; border-bottom:1px solid var(--line); display:flex;
           align-items:center; gap:14px; position:sticky; top:0; background:var(--bg); }
  header h1 { font-size:16px; margin:0; letter-spacing:.5px; }
  header .sub { color:var(--dim); font-size:12px; }
  button { font:inherit; cursor:pointer; border:1px solid var(--line);
           background:#1b2130; color:var(--ink); padding:6px 12px; border-radius:6px; }
  button:hover { border-color:var(--cyan); }
  button.go { border-color:var(--green); color:var(--green); }
  button.warn { border-color:var(--rose); color:var(--rose); }
  #wrap { padding:22px; max-width:1000px; margin:0 auto; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px;
          padding:16px 18px; margin-bottom:16px; }
  .card h2 { font-size:14px; margin:0 0 8px; word-break:break-all; }
  .badge { display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px;
           font-weight:700; text-transform:uppercase; letter-spacing:.5px; }
  .b-suspicious { background:rgba(244,63,94,.15); color:var(--rose); }
  .b-benign { background:rgba(52,211,153,.15); color:var(--green); }
  .b-inconclusive { background:rgba(139,155,180,.15); color:var(--dim); }
  .b-approved { background:rgba(56,189,248,.15); color:var(--cyan); }
  .b-published { background:rgba(52,211,153,.15); color:var(--green); }
  .b-pending-review { background:rgba(251,191,36,.15); color:var(--amber); }
  .meta { color:var(--dim); font-size:12px; margin:6px 0; }
  .meta b { color:var(--ink); font-weight:600; }
  .tweet { width:100%; background:#0e1220; color:var(--ink); border:1px solid var(--line);
           border-radius:6px; padding:8px; font:inherit; resize:vertical; min-height:56px; }
  .safety { background:rgba(244,63,94,.1); border:1px solid var(--rose); color:var(--rose);
            padding:8px 10px; border-radius:6px; margin:8px 0; font-size:12px; }
  .actions { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-top:10px; }
  label.t { color:var(--dim); font-size:12px; display:inline-flex; align-items:center; gap:4px; }
  .out { font-size:12px; color:var(--dim); margin-top:8px; white-space:pre-wrap; }
  .empty { color:var(--dim); text-align:center; padding:40px; }
</style>
</head>
<body>
<header>
  <h1>ARGUS &middot; Findings</h1>
  <span class="sub" id="sub">review &amp; publish - nothing posts without your click</span>
  <span style="flex:1"></span>
  <button onclick="load()">Refresh</button>
</header>
<div id="wrap"><div class="empty">loading...</div></div>

<script>
const $wrap = document.getElementById('wrap');
const esc = s => (s??'').toString().replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function api(path, body) {
  const opt = body ? {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)} : {};
  const r = await fetch(path, opt);
  return r.json();
}

function card(d) {
  const vb = 'b-' + (d.verdict||'inconclusive');
  const sb = 'b-' + (d.status||'pending-review');
  const targets = ['vt','twitter','linkedin'];
  const canPublish = d.status === 'approved';
  const published = d.status === 'published';
  return `<div class="card" data-id="${esc(d.id)}">
    <h2>${esc(d.sample||d.id)}
      <span class="badge ${vb}">${esc(d.verdict||'?')}</span>
      <span class="badge ${sb}">${esc(d.status||'?')}</span></h2>
    <div class="meta">confidence <b>${d.confidence??'?'}%</b> &middot; signals <b>${esc((d.signals||[]).join(', ')||'-')}</b></div>
    <div class="meta">ATT&CK <b>${esc((d.attack||[]).join(', ')||'-')}</b> &middot; VirusTotal <b>${esc(d.vt||'n/a')}</b></div>
    <div class="meta">sha256 <b>${esc((d.sha256||'').slice(0,32))}...</b></div>
    ${d.safety ? `<div class="safety">SAFETY: ${esc(d.safety)} - publish blocked unless you tick "force override"</div>` : ''}
    <textarea class="tweet" readonly>${esc(d.tweet||'')}</textarea>
    <div class="actions">
      ${published ? '<span class="badge b-published">PUBLISHED</span>' :
        canPublish ? `
          ${targets.map(t=>`<label class="t"><input type="checkbox" class="tg" value="${t}" ${t==='vt'?'checked':''}> ${t}</label>`).join('')}
          <label class="t"><input type="checkbox" class="force"> force override</label>
          <button onclick="send('${esc(d.id)}', false)">Dry run</button>
          <button class="go" onclick="send('${esc(d.id)}', true)">Publish</button>`
        : `<button class="go" onclick="approve('${esc(d.id)}')">Approve</button>`}
    </div>
    <div class="out"></div>
  </div>`;
}

async function load() {
  const r = await api('/api/publish/drafts');
  const drafts = (r.drafts||[]);
  document.getElementById('sub').textContent = `${drafts.length} finding(s) - nothing posts without your click`;
  $wrap.innerHTML = drafts.length ? drafts.map(card).join('') : '<div class="empty">No findings in the review queue yet. Run a hunt.</div>';
}

async function approve(id) {
  const r = await api('/api/publish/approve', {draft:id});
  out(id, r.error ? 'ERROR: '+r.error : 'approved - now pick targets and Publish');
  load();
}

async function send(id, confirm) {
  const el = document.querySelector(`.card[data-id="${id}"]`);
  const targets = [...el.querySelectorAll('.tg:checked')].map(c=>c.value);
  const force = el.querySelector('.force')?.checked || false;
  if (!targets.length) { out(id, 'pick at least one target'); return; }
  const r = await api('/api/publish/send', {draft:id, targets, confirm, force});
  if (r.error) { out(id, 'ERROR: '+r.error); return; }
  if (r.blocked) { out(id, 'BLOCKED: '+r.blocked); return; }
  const mode = r.dry_run ? 'DRY RUN (nothing sent)' : 'LIVE PUBLISH';
  const lines = (r.results||[]).map(x => x.skipped ? `  - ${x.target}: skipped (${x.detail})`
    : `  ${x.ok?'OK ':'ERR'} ${x.target}: ${x.detail}`);
  out(id, `== ${mode} ==\n` + lines.join('\n'));
  if (!r.dry_run) load();
}

function out(id, msg) {
  const el = document.querySelector(`.card[data-id="${id}"] .out`);
  if (el) el.textContent = msg;
}

load();
</script>
</body>
</html>
